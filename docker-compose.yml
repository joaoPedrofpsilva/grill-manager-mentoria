services:
  db:
    image: postgres:16
    container_name: espetohub-pg
    environment:
      POSTGRES_USER: espeto
      POSTGRES_PASSWORD: espeto
      POSTGRES_DB: espetohub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
